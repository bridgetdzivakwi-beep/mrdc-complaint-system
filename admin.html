<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRDC Admin Office</title>
 <script>
// We will handle login with nice form, not pop-up
window.MRDC_PASS = "Makonde@2026";
</script>
<style>
#lockScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:#f5f5f5;display:flex;align-items:center;justify-content:center;z-index:99999}
#lockBox{background:white;padding:30px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.2);text-align:center;width:90%;max-width:350px}
#lockBox input{width:100%;padding:12px;margin:15px 0;border:1px solid #ccc;border-radius:8px}
#lockBox button{width:100%;padding:12px;background:#cc0000;color:white;border:none;border-radius:8px;cursor:pointer;font-weight:bold}
</style>
<div id="lockScreen">
  <div id="lockBox">
    <img src="logo.jpg" style="width:60px"><br>
    <h3 style="color:#cc0000">MRDC Admin Login</h3>
    <p style="font-size:13px">For Officials Only</p>
    <input type="password" id="passInput" placeholder="Enter Password">
    <button onclick="checkPass()">Login</button>
    <p id="err" style="color:red;font-size:12px;display:none">Wrong password</p>
  </div>
</div>
<script>
function checkPass(){
  let p = document.getElementById('passInput').value;
  if(p === window.MRDC_PASS){
    document.getElementById('lockScreen').style.display='none';
  } else {
    document.getElementById('err').style.display='block';
    // Wrong 3 times = kick back to citizen form
    window.wrong = (window.wrong||0)+1;
    if(window.wrong>=3){
      window.location.replace("index.html");
    }
  }
}
// Hide complaints until login
document.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('passInput').focus();
});
</script> 
<style>
body{font-family:Arial;padding:15px;background:#f5f5f5}
table{width:100%;background:white;border-collapse:collapse;margin-top:15px}
th,td{border:1px solid #ddd;padding:8px;font-size:13px;text-align:left}
th{background:#cc0000;color:white;position:sticky;top:0}
button{padding:8px 14px;background:#cc0000;color:white;border:none;border-radius:4px;cursor:pointer;margin:3px;font-weight:bold}
button:hover{background:#990000}
h2{color:#cc0000}
</style>
</head>
<body>
<div style="text-align:center;">
<img src="logo.jpg" style="width:85px;height:85px;border-radius:12px;">
<h2 style="margin:8px 0;">MRDC Office Dashboard - All Citizen Complaints</h2>
</div>
<button onclick="loadData()">🔄 Refresh Complaints</button>
<button onclick="exportCSV()">⬇️ Download CSV</button>
<p style="font-size:13px;color:#666">Auto-loads complaints from all wards - shared central database</p>
<table>
<thead><tr><th>Date/Time</th><th>Name</th><th>Phone</th><th>Ward</th><th>Category</th><th>Complaint</th></tr></thead>
<tbody id="tbody"><tr><td colspan="6">Loading complaints from office database...</td></tr></tbody>
</table>
<p><a href="index.html" style="color:#cc0000">← Back to Citizen Form</a></p>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzy2as-gYd1gcTYNgCK6MR3g3dkuiR1lPveC68xfMHfFPMIM0zp_xTu3muXYN56fK5qKA/exec";
async function loadData(){
  document.getElementById('tbody').innerHTML="<tr><td colspan='6'>Loading...</td></tr>";
  try{
    const res = await fetch(SCRIPT_URL);
    const data = await res.json();
    if(data.length==0){ document.getElementById('tbody').innerHTML="<tr><td colspan='6'>No complaints yet</td></tr>"; return; }
    let html="";
    data.reverse().forEach(c=>{
      const date = new Date(c.timestamp).toLocaleString();
      html+=`<tr><td>${date}</td><td>${c.name}</td><td>${c.phone}</td><td>${c.ward}</td><td>${c.category}</td><td>${c.message}</td></tr>`;
    });
    document.getElementById('tbody').innerHTML=html;
  }catch(e){
    document.getElementById('tbody').innerHTML="<tr><td colspan='6'>Error: Make sure Apps Script is deployed as 'Anyone' can access. Check deployment.</td></tr>";
  }
}
function exportCSV(){
  fetch(SCRIPT_URL).then(r=>r.json()).then(data=>{
    let csv='Date,Name,Phone,Ward,Category,Complaint,Status\n'+data.map(c=>`"${c.timestamp}","${c.name}","${c.phone}","${c.ward}","${c.category}","${c.message.replace(/"/g,'""')}","${c.status}"`).join('\n');
    let a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='MRDC_Central_Complaints.csv'; a.click();
  });
}
loadData();
</script>
</body>
</html>
